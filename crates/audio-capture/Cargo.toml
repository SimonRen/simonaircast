[package]
name = "audio-capture"
description = "System audio capture (WASAPI loopback on Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rtrb = "0.4.0"
rubato = "5.0.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[lints]
workspace = true
