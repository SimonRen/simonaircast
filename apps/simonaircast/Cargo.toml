[package]
name = "simonaircast"
description = "Stream Windows system audio to AirPlay 2 speakers (HomePod)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
airplay = { path = "../../crates/airplay" }
anyhow = "1.0.104"
audio-capture = { path = "../../crates/audio-capture" }
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
